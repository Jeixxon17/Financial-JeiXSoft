<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cuadrar con el banco</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#b9cbff}a:hover{color:#f4f6fc}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cmp div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:#1a2441}
.cmp span{font:400 11px/14px Manrope,system-ui,sans-serif;color:#8a95b1}
.cmp strong{font:600 16px/22px Manrope,system-ui,sans-serif;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div class="jx-screen" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: Manrope, system-ui, sans-serif;">
  <div style="padding: 20px; display: flex; flex-direction: column; gap: 16px;">
    <h1 style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 600; text-align: center;">ADDI</h1>
    <div class="jx-bank-card" style="height: 190px; box-sizing: border-box;">
      <div class="jx-bank-card__top"><span class="jx-bank-card__brand">ADDI</span><span class="jx-chip">Créditos</span></div>
    </div>
  </div>
  <div class="jx-overlay"></div>

  <div class="jx-sheet">
    <span class="jx-sheet__grab"></span>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h2>Cuadrar con el banco</h2>
      <p style="margin: 0; font: 400 14px/20px Manrope, system-ui, sans-serif; color: #a6b0c9;">Escribe lo que muestra hoy la app de ADDI y la tarjeta queda igual.</p>
    </div>
    <div class="jx-field"><label for="tot">Pago total / deuda total</label><input id="tot" value="$ 2.322.321"><small>En la app: $ 3.713.819</small></div>
    <div class="jx-field"><label for="cupo">Cupo usado</label><input id="cupo" value="$ 1.421.995"><small>En la app: $ 1.375.272</small></div>
    <div class="jx-field"><label for="gr">Crédito Grande pendiente</label><input id="gr" value="$ 830.715"><small>Aparte del cupo</small></div>
    <div class="cmp">
      <div><span>Cupo disponible</span><strong style="color: #4ade96;">$ 1.578.005</strong></div>
      <div><span>Saldo sin detalle</span><strong>$ 943.381</strong></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <a class="jx-btn jx-btn--secondary" href="DetalleTarjeta.dc.html" style="text-decoration: none;">Cancelar</a>
      <a class="jx-btn jx-btn--primary" href="Cuentas.dc.html" style="text-decoration: none;">Cuadrar</a>
    </div>
  </div>
</div>
</x-dc>

</html>
