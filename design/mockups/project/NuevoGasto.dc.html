<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Registrar gasto</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#b9cbff}a:hover{color:#f4f6fc}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;color:#a6b0c9;font:500 12px/16px Manrope,system-ui,sans-serif;cursor:pointer}
.cat span{display:grid;place-items:center;width:48px;height:48px;border-radius:999px;background:#1a2441;border:1px solid #26314f;color:#f4f6fc;transition:background-color .2s ease,border-color .2s ease}
.cat.on{color:#f4f6fc}
.cat.on span{background:#4f6fdc;border-color:#4f6fdc}
</style>
</helmet>
<div class="jx-screen" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: Manrope, system-ui, sans-serif;">
  <div style="padding: 20px; display: flex; flex-direction: column; gap: 18px;">
    <div class="jx-balance-header"><span class="jx-avatar jx-avatar--lg">JM</span><div class="jx-balance-header__text"><span class="jx-balance-header__label">Saldo disponible</span><span class="jx-balance-header__amount">$ 46.050</span></div></div>
    <div class="jx-bank-card" style="height: 180px; box-sizing: border-box;"><div class="jx-bank-card__top"><span class="jx-bank-card__brand">MasterCard Gold</span></div></div>
  </div>
  <div class="jx-overlay"></div>

  <sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
    <div class="jx-toast" style="position: absolute; left: 16px; right: 16px; top: 16px; z-index: 5;">
      <div style="display: flex; justify-content: space-between; align-items: center; font: 600 11px/14px Manrope, system-ui, sans-serif; letter-spacing: .5px; text-transform: uppercase; color: #8a95b1;"><span>Tu asesor</span><button onClick="{{close}}" aria-label="Cerrar" style="border: 0; background: none; color: #8a95b1; cursor: pointer;">✕</button></div>
      <div class="jx-notice is-danger" style="padding: 12px;"><span class="jx-notice__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></span><div><p class="jx-notice__title">Ya no queda dinero libre este mes</p><p class="jx-notice__text">Cada gasto extra sale de lo que necesitas para pagar.</p></div></div>
      <div class="jx-notice is-warning" style="padding: 12px;"><span class="jx-notice__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg></span><div><p class="jx-notice__title">Comida va por encima de lo normal</p><p class="jx-notice__text">Llevas $ 603.360 y sueles gastar $ 265.020.</p></div></div>
    </div>
  </sc-if>

  <div class="jx-sheet" style="top: 76px; overflow: hidden;">
    <span class="jx-sheet__grab"></span>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Registrar</h2>
      <a class="jx-icon-btn" href="Main.dc.html" aria-label="Cerrar" style="width: 36px; height: 36px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
    </div>
    <div class="jx-segmented" role="tablist">
      <sc-for list="{{types}}" as="t" hint-placeholder-count="3"><button class="{{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
    </div>
    <div class="jx-amount-input">
      <span class="jx-amount-input__label">¿Cuánto?</span>
      <span class="jx-amount-input__value" style="{{amountStyle}}">{{sign}}$ 80.000</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px;">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
        <button class="{{c.cls}}" onClick="{{c.pick}}"><span>
          <sc-if value="{{c.food}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg></sc-if>
          <sc-if value="{{c.bus}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 18a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM19 18a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM5 16l4-6h5l3 6M9 10l-1-3H6M14 10l2-4h2"/></svg></sc-if>
          <sc-if value="{{c.shop}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/></svg></sc-if>
          <sc-if value="{{c.home}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></sc-if>
          <sc-if value="{{c.fun}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12h4M8 10v4M15 13h.01M18 11h.01"/><rect x="2" y="6" width="20" height="12" rx="6"/></svg></sc-if>
        </span>{{c.label}}</button>
      </sc-for>
    </div>
    <div class="jx-field"><label for="desc">Descripción</label><input id="desc" value="Almuerzo con el equipo"></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <div class="jx-field"><label for="acc">Cuenta</label><select id="acc"><option>Bancolombia</option><option>Nu</option><option>Efectivo</option></select></div>
      <div class="jx-field"><label for="date">Fecha</label><input id="date" value="Hoy, 3 nov"></div>
    </div>
    <button class="jx-btn jx-btn--primary jx-btn--block" onClick="{{save}}" style="margin-top: auto;">{{saveLabel}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { type: 'expense', cat: 'food', saved: false }; }
renderVals() {
const { type, cat, saved } = this.state;
const types = [['expense', 'Gasto'], ['income', 'Ingreso'], ['transfer', 'Transferir']].map(([id, label]) => ({
  label, cls: id === type ? 'is-on' : '', pick: () => this.setState({ type: id, saved: false })
}));
const cats = [['food', 'Comida'], ['bus', 'Transporte'], ['shop', 'Compras'], ['home', 'Casa'], ['fun', 'Salidas']].map(([id, label]) => ({
  label, [id]: true, cls: id === cat ? 'cat on' : 'cat', pick: () => this.setState({ cat: id })
}));
return {
  types, cats, saved,
  sign: type === 'income' ? '+' : type === 'expense' ? '−' : '',
  amountStyle: type === 'income' ? 'color: var(--success);' : '',
  saveLabel: saved ? 'Guardado' : type === 'income' ? 'Guardar ingreso' : type === 'transfer' ? 'Guardar transferencia' : 'Guardar gasto',
  save: () => this.setState({ saved: true }),
  close: () => this.setState({ saved: false })
};
}
}
</script>
</body>
</html>
