<div class="jx-screen" style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 18px; font-family: Manrope, system-ui, sans-serif;">
  <div style="display: flex; align-items: center; gap: 14px;">
    <a class="jx-icon-btn" href="Bienvenida.dc.html" aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
    <div class="jx-steps" style="flex: 1;"><span class="is-on"></span><span></span><span></span></div>
    <span style="font-size: 12px; line-height: 16px; color: #8a95b1;">Paso 1 de 3</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.3px;">Crea tu cuenta</h1>
    <p style="margin: 0; font-size: 15px; line-height: 22px; color: #a6b0c9;">Gratis. Tus datos solo los ves tú.</p>
  </div>

  <form style="display: flex; flex-direction: column; gap: 14px;">
    <div class="jx-field"><label for="name">Nombre</label><input id="name" value="Jeison Martínez"></div>
    <div class="jx-field"><label for="email">Correo</label><input id="email" type="email" value="jeison@correo.com"></div>
    <div class="jx-field">
      <label for="pass">Contraseña</label>
      <input id="pass" type="password" value="MiPlata2027">
      <div style="display: flex; gap: 14px; flex-wrap: wrap; margin-top: 2px;">
        <span class="rule" style="color: #4ade96;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>8 caracteres</span>
        <span class="rule" style="color: #4ade96;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Un número</span>
        <span class="rule" style="color: #8a95b1;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>Un símbolo</span>
      </div>
    </div>
    <div class="jx-field">
      <label for="pay">¿Cada cuánto te pagan?</label>
      <select id="pay"><option>Quincenal (15 y 30)</option><option>Mensual</option><option>Semanal</option><option>Ingresos variables</option></select>
      <small>Así organizamos tus quincenas y tu presupuesto.</small>
    </div>
    <label class="check"><input type="checkbox" checked>Acepto los términos y la política de datos. Solo guardamos lo que tú registras.</label>
  </form>

  <a class="jx-btn jx-btn--primary jx-btn--block" href="CrearPin.dc.html" style="text-decoration: none; box-sizing: border-box; margin-top: auto;">Continuar</a>
  <p style="margin: 0; text-align: center; font-size: 14px; line-height: 20px; color: #a6b0c9;">¿Ya tienes cuenta? <a href="Login.dc.html" style="font-weight: 600; text-decoration: none;">Inicia sesión</a></p>
