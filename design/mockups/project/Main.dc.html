<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inicio</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#f4f6fc}a:hover{color:#b9cbff}
</style>
</helmet>
<div class="jx-screen" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 18px; overflow: hidden; font-family: Manrope, system-ui, sans-serif;">
  <div class="jx-balance-header">
    <span class="jx-avatar jx-avatar--lg">JM</span>
    <div class="jx-balance-header__text">
      <span class="jx-balance-header__label">Saldo disponible</span>
      <span class="jx-balance-header__amount">$ 46.050</span>
    </div>
    <a class="jx-icon-btn" href="Perfil.dc.html" aria-label="Avisos y ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div class="jx-carousel" style="margin-top: 22px;">
      <sc-for list="{{cards}}" as="card" hint-placeholder-count="4">
        <button class="jx-bank-card is-shiny" style="{{card.style}}" onClick="{{card.pick}}" aria-label="{{card.label}}">
          <span class="jx-bank-card__top"><span class="jx-bank-card__brand">{{card.name}}</span><span class="jx-chip">{{card.kind}}</span></span>
          <span class="jx-bank-card__mid">
            <span class="jx-bank-card__chip"></span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M8.5 9a5 5 0 0 1 0 6M12 7a8 8 0 0 1 0 10M15.5 5a11 11 0 0 1 0 14"/></svg>
            <span class="jx-bank-card__number">•••• •••• •••• {{card.last4}}</span>
          </span>
          <span class="jx-bank-card__foot">
            <span style="text-align: left;"><span class="jx-bank-card__label">{{card.labelA}}</span><span class="jx-bank-card__value">{{card.valueA}}</span></span>
            <span style="text-align: right;"><span class="jx-bank-card__label">{{card.labelB}}</span><span class="jx-bank-card__value">{{card.valueB}}</span></span>
          </span>
        </button>
      </sc-for>
    </div>
    <div class="jx-dots">
      <sc-for list="{{cards}}" as="dot" hint-placeholder-count="4"><span class="{{dot.dot}}"></span></sc-for>
    </div>
  </div>

  <div class="jx-actions">
    <a class="jx-action is-active" href="NuevoGasto.dc.html" style="text-decoration: none;"><span class="jx-action__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></span>Gasto</a>
    <a class="jx-action" href="NuevoIngreso.dc.html" style="text-decoration: none;"><span class="jx-action__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>Ingreso</a>
    <a class="jx-action" href="PagarTarjeta.dc.html" style="text-decoration: none;"><span class="jx-action__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M15 15h2"/></svg></span>Pagar</a>
    <a class="jx-action" href="Quincenas.dc.html" style="text-decoration: none;"><span class="jx-action__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6h.01M12 6h.01M18 6h.01M6 12h.01M12 12h.01M18 12h.01M6 18h.01M12 18h.01M18 18h.01"/></svg></span>Más</a>
  </div>

  <div class="jx-notice is-warning">
    <span class="jx-notice__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></span>
    <div><p class="jx-notice__title">Las quincenas no alcanzan este mes</p><p class="jx-notice__text">Faltan $ 557.277 para tus obligaciones.</p></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div class="jx-section-head"><h2>Movimientos recientes</h2><a href="Movimientos.dc.html">Ver todo</a></div>
    <div class="jx-list">
      <a class="jx-row" href="DetalleMovimiento.dc.html" style="text-decoration: none; color: inherit;">
        <span class="jx-avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg></span>
        <span class="jx-row__main"><span class="jx-row__title">Nómina Virtual Soft</span><span class="jx-row__meta">30 oct · Bancolombia</span></span>
        <span class="jx-row__end"><span class="jx-row__amount is-income">+1.887.535</span><span class="jx-row__time">06:10</span></span>
      </a>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 20px;">
    <dc-import name="Nav" active="home" hint-size="350px,66px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { front: 0 }; }
renderVals() {
const data = [
  { name: 'MasterCard Gold', kind: 'Crédito', last4: '1410', labelA: 'Pago mínimo', valueA: '$ 1.688.317', labelB: 'Fecha límite', valueB: '5 nov' },
  { name: 'Nu', kind: 'Crédito', last4: '4526', labelA: 'Pago mínimo', valueA: '$ 443.626', labelB: 'Fecha límite', valueB: '18 nov' },
  { name: 'ADDI', kind: 'Créditos', last4: '0020', labelA: 'Cupo disponible', valueA: '$ 1.578.005', labelB: 'Próximo pago', valueB: '4 dic' },
  { name: 'Bancolombia', kind: 'Ahorros', last4: '4521', labelA: 'Saldo', valueA: '$ 23.550', labelB: 'Titular', valueB: 'Jeison M.' }
];
const n = data.length;
const front = this.state.front;
const cards = data.map((c, i) => {
  const pos = (i - front + n) % n;
  const y = [0, -12, -22, -30][pos];
  const s = [1, 0.94, 0.88, 0.82][pos];
  const o = [1, 0.7, 0.45, 0.25][pos];
  return {
    ...c,
    label: 'Tarjeta ' + c.name + (pos === 0 ? ', al frente' : ', toca para traerla'),
    style: 'transform: translateY(' + y + 'px) scale(' + s + '); opacity: ' + o + '; z-index: ' + (n - pos) + '; text-align: left; width: 100%; border: 0; font: inherit; color: var(--card-ink);',
    dot: pos === 0 ? 'is-on' : '',
    pick: () => this.setState({ front: pos === 0 ? (i + 1) % n : i })
  };
});
return { cards };
}
}
</script>
</body>
</html>
