<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Crear PIN</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#b9cbff}a:hover{color:#f4f6fc}
.pin-key{display:grid;place-items:center;height:62px;border-radius:999px;border:0;background:transparent;color:#f4f6fc;font:600 26px/1 Manrope,system-ui,sans-serif;cursor:pointer}
.pin-key:hover{background:#1a2441}
.dot{width:14px;height:14px;border-radius:999px;box-sizing:border-box;border:2px solid #5d6b96}
.dot.on{background:#b9cbff;border-color:#b9cbff}
</style>
</helmet>
<div class="jx-screen" style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 28px 28px; display: flex; flex-direction: column; align-items: center; gap: 24px; font-family: Manrope, system-ui, sans-serif;">
  <div style="display: flex; align-items: center; gap: 14px; width: 100%;">
    <a class="jx-icon-btn" href="Registro.dc.html" aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
    <div class="jx-steps" style="flex: 1;"><span class="is-on"></span><span class="is-on"></span><span></span></div>
    <span style="font-size: 12px; line-height: 16px; color: #8a95b1;">Paso 2 de 3</span>
  </div>

  <div style="display: grid; place-items: center; width: 72px; height: 72px; border-radius: 999px; background: #202f61; color: #b9cbff; margin-top: 12px;">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;">
    <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.3px;">Crea tu PIN</h1>
    <p style="margin: 0; font-size: 15px; line-height: 22px; color: #a6b0c9; max-width: 290px;">6 dígitos para abrir la app rápido. Se pide de nuevo si la app pasa 5 minutos cerrada.</p>
  </div>

  <div style="display: flex; gap: 14px;" aria-label="2 de 6 dígitos">
    <span class="dot on"></span><span class="dot on"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 28px; width: 100%; max-width: 300px; margin-top: auto;">
    <button class="pin-key">1</button><button class="pin-key">2</button><button class="pin-key">3</button>
    <button class="pin-key">4</button><button class="pin-key">5</button><button class="pin-key">6</button>
    <button class="pin-key">7</button><button class="pin-key">8</button><button class="pin-key">9</button>
    <span></span>
    <button class="pin-key">0</button>
    <button class="pin-key" aria-label="Borrar"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM18 9l-6 6M12 9l6 6"/></svg></button>
  </div>
  <a class="jx-btn jx-btn--ghost" href="Huella.dc.html" style="text-decoration: none; color: #a6b0c9;">Siguiente: activar huella</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
