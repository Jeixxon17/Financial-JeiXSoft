<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ingreso con PIN</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#b9cbff}a:hover{color:#f4f6fc}
.pin-key{display:grid;place-items:center;height:62px;border-radius:999px;border:0;background:transparent;color:#f4f6fc;font:600 26px/1 Manrope,system-ui,sans-serif;cursor:pointer;transition:background-color .15s ease}
.pin-key:hover{background:#1a2441}
.pin-key:active{background:#253157}
.dot{width:14px;height:14px;border-radius:999px;box-sizing:border-box;border:2px solid #5d6b96;transition:background-color .15s ease,border-color .15s ease,transform .15s ease}
.dot.on{background:#b9cbff;border-color:#b9cbff;transform:scale(1.1)}
</style>
</helmet>
<div class="jx-screen" style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 28px 28px; display: flex; flex-direction: column; align-items: center; gap: 24px; font-family: Manrope, system-ui, sans-serif;">
  <img src="/_blob/dc25be3eec8d2f49aa2703a8fd588b24" alt="TuPlataAlDia" style="width: 76px; height: 76px; border-radius: 20px;">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;">
    <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.3px;">Hola, Jeison</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px; color: #a6b0c9;">{{hint}}</p>
  </div>
  <div style="display: flex; gap: 14px;" aria-label="{{count}} de 6 dígitos">
    <sc-for list="{{dots}}" as="d" hint-placeholder-count="6"><span class="{{d.cls}}"></span></sc-for>
  </div>
  <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
    <a class="jx-btn jx-btn--primary" href="Main.dc.html" style="text-decoration: none; min-width: 200px;">Entrar</a>
  </sc-if>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 28px; width: 100%; max-width: 300px; margin-top: auto;">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="9"><button class="pin-key" onClick="{{k.press}}">{{k.n}}</button></sc-for>
    <a class="pin-key" href="Huella.dc.html" aria-label="Entrar con huella" style="text-decoration: none;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b9cbff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4M14 13.12c0 2.38 0 6.38-1 8.88M17.29 21.02c.12-.6.43-2.3.5-3.02M2 12a10 10 0 0 1 18-6M2 16h.01M21.8 16c.2-2 .131-5.354 0-6M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2M8.65 22c.21-.66.45-1.32.57-2M9 6.8a6 6 0 0 1 9 5.2v2"/></svg></a>
    <button class="pin-key" onClick="{{zero}}">0</button>
    <button class="pin-key" aria-label="Borrar" onClick="{{erase}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM18 9l-6 6M12 9l6 6"/></svg></button>
  </div>
  <a href="Login.dc.html" style="font-size: 14px; line-height: 20px; font-weight: 500; text-decoration: none;">Olvidé mi PIN</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { count: 0 }; }
renderVals() {
const count = this.state.count;
const add = () => this.setState({ count: Math.min(6, count + 1) });
return {
  count,
  done: count === 6,
  hint: count === 6 ? 'Listo, toca Entrar' : 'Ingresa tu PIN de 6 dígitos',
  dots: [0, 1, 2, 3, 4, 5].map((i) => ({ cls: i < count ? 'dot on' : 'dot' })),
  keys: [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => ({ n: String(n), press: add })),
  zero: add,
  erase: () => this.setState({ count: Math.max(0, count - 1) })
};
}
}
</script>
</body>
</html>
