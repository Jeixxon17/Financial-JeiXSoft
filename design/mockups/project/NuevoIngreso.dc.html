<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Registrar ingreso</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#b9cbff}a:hover{color:#f4f6fc}
.pick{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:#111a31;border:1px solid #26314f;color:#f4f6fc;font:500 14px/20px Manrope,system-ui,sans-serif}
.pick.on{border-color:#4f6fdc;background:#162147}
.pick small{display:block;color:#8a95b1;font:400 12px/16px Manrope,system-ui,sans-serif}
</style>

<div class="jx-screen" style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 16px; font-family: Manrope, system-ui, sans-serif;">
  <div style="display: flex; align-items: center; justify-content: space-between;">
    <a class="jx-icon-btn" href="Main.dc.html" aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
    <h1 style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 600;">Nuevo ingreso</h1>
    <span style="width: 40px;"></span>
  </div>

  <div class="jx-amount-input">
    <span class="jx-amount-input__label">¿Cuánto recibiste?</span>
    <span class="jx-amount-input__value" style="color: #4ade96;">+$ 1.887.333</span>
    <span class="jx-chip" style="margin-top: 6px;">Neto de la quincena según tu nómina</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font: 500 13px/18px Manrope, system-ui, sans-serif; color: #a6b0c9;">Tipo de ingreso</span>
    <div class="pick on">
      <span class="jx-avatar" style="background: #202f61;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b9cbff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg></span>
      <span style="flex: 1;">Salario<small>Quincena del 15 de noviembre</small></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b9cbff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <div class="pick">
      <span class="jx-avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg></span>
      <span style="flex: 1;">Transferencia recibida<small>De otra persona o cuenta</small></span>
    </div>
    <div class="pick">
      <span class="jx-avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
      <span style="flex: 1;">Otro ingreso<small>Ventas, trabajos extra, reembolsos</small></span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
    <div class="jx-field"><label for="acc">A la cuenta</label><select id="acc"><option>Bancolombia</option><option>Efectivo</option></select></div>
    <div class="jx-field"><label for="date">Fecha</label><input id="date" value="15 nov"></div>
  </div>

  <a class="jx-btn jx-btn--primary jx-btn--block" href="IngresoRegistrado.dc.html" style="text-decoration: none; box-sizing: border-box; margin-top: auto;">Guardar ingreso</a>
</div>

</html>
