<style>
body{margin:0}
a{color:#b9cbff}a:hover{color:#f4f6fc}
.preset{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid #26314f;background:#111a31;color:#a6b0c9;font:500 12px/16px Manrope,system-ui,sans-serif;cursor:pointer}

.sms .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sms .main strong{font:600 14px/20px Manrope,system-ui,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sms .main small{font:400 12px/16px Manrope,system-ui,sans-serif;color:#8a95b1}
.sms .amt{font:600 14px/20px Manrope,system-ui,sans-serif;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div class="jx-screen" style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 14px; font-family: Manrope, system-ui, sans-serif;">

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">

    <div class="jx-field"><label for="to">Hasta</label><input id="to" value="3 nov 2026"></div>
  </div>
  <div style="display: flex; gap: 6px; flex-wrap: wrap;">
    <button class="preset">3 días</button><button class="preset on">7 días</button><button class="preset">15 días</button><button class="preset">30 días</button>
  </div>

  <div style="font: 500 13px/18px Manrope, system-ui, sans-serif; color: #a6b0c9;">9 SMS · <span style="color: #4ade96;">2 sin registrar</span> · 7 ya registrados</div>

    <label class="sms done"><input type="checkbox"><span class="main"><strong>Pago de nómina</strong><small>30 oct · 06:10 · parece ya registrado</small></span><span class="amt" style="color: #4ade96;">+1.887.535</span></label>

  <a class="jx-btn jx-btn--primary jx-btn--block" href="PorConfirmar.dc.html" style="text-decoration: none; box-sizing: border-box; margin-top: auto;">Enviar 2 a Por confirmar</a>
