<!-- @dsCard height=300 -->
<style>
  .cv { position: relative; width: 960px; height: 300px; background: var(--bg-base); overflow: hidden; font-family: var(--font-sans); }
  .cv svg { position: absolute; inset: 0; }
  .cv .glow { fill: var(--bg-glow); }
  .cv .card { fill: var(--card-base); }
  .cv .light { fill: var(--accent-glow); }
  .cv .panel { fill: var(--surface-200); }
  .cv .pale { fill: var(--accent-light); }
  .cv .prim { fill: var(--primary); }
  .cv .ring { fill: none; stroke: var(--accent-light); stroke-width: 6; }
  .cv .ink { stroke: var(--card-ink); stroke-width: 7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .cv .txt { position: absolute; left: 40px; bottom: 36px; max-width: 440px; }
  .cv h1 { margin: 0; font-size: 60px; line-height: 0.95; font-weight: 700; letter-spacing: -1.5px; color: var(--ink); }
  .cv h1 span { color: var(--accent-light); }
  .cv p { margin: 12px 0 0; font-size: 14px; color: var(--ink-muted); }
</style>
<div class="cv">
  <!-- blocks: card-base slab (radius-lg 20) 300x188, primary pill (radius-pill), surface-200 panel (radius-lg), accent-light pill (progress); bg-glow field top-right -->
  <!-- arrangement: one tall card slab with satellites, bleeding off the right edge, like the stacked cards of the app -->
  <!-- pattern: pills from radius-pill (the progress bar and nav circles) — the brand is soft and rounded -->
  <!-- steps/radii: space-5 20, space-6 24, radius-lg 20, radius-pill -->
  <svg viewBox="0 0 960 300" width="960" height="300">
    <ellipse class="glow" cx="760" cy="-20" rx="320" ry="150" />
    <rect class="panel" x="500" y="40" width="280" height="96" rx="20" />
    <rect class="card" x="600" y="96" width="320" height="196" rx="20" />
    <ellipse class="light" cx="840" cy="230" rx="90" ry="70" opacity="0.85" />
    <rect class="pale" x="520" y="96" width="160" height="24" rx="12" />
    <rect class="prim" x="500" y="236" width="80" height="44" rx="22" />
    <circle class="prim" cx="940" cy="40" r="26" />
    <circle class="ring" cx="690" cy="196" r="34" />
    <path class="ink" d="M675 197l11 11 22-24" />
  </svg>
  <div class="txt">
    <h1>TuPlata<span>AlDia</span></h1>
    <p>Tus cuentas, tarjetas y ahorros al día, en pesos.</p>
  </div>
</div>
